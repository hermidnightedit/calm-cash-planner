<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Calm Cash Planner</title>
<meta name="description" content="A calm, ADHD-friendly budget planner. Know what is safe to spend today.">
<meta name="theme-color" content="#fbf6f1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0e1220" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Calm Cash">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#fbf6f1; --surface:#fffdfa; --surface2:#f6ece6; --text:#33262a; --muted:#8c7a7e; --line:#efe1da;
  --accent:#c27a86; --accent-strong:#9b5260; --accent-soft:#f8e7e7; --on-accent:#ffffff;
  --warn:#c4874a; --warn-soft:#f8ece0; --danger:#b8504f; --danger-soft:#f7e1df; --good:#5f8f6b;
  --pay:#7d76b0; --pay-soft:#eceaf6;
  --shadow:0 1px 2px rgba(51,38,42,.05),0 8px 24px rgba(51,38,42,.06);
  --radius:20px; --radius-sm:14px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e1220; --surface:#161b2e; --surface2:#1e2440; --text:#e9edf5; --muted:#9aa3ba; --line:#28304d;
    --accent:#e8a9b2; --accent-strong:#f5c9cf; --accent-soft:#342437; --on-accent:#1a1220;
    --warn:#e2ac72; --warn-soft:#352a22; --danger:#e58b84; --danger-soft:#3a2229; --good:#8fcf9f;
    --pay:#8fb4dc; --pay-soft:#1f2b45;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.25);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0e1220; --surface:#161b2e; --surface2:#1e2440; --text:#e9edf5; --muted:#9aa3ba; --line:#28304d;
  --accent:#e8a9b2; --accent-strong:#f5c9cf; --accent-soft:#342437; --on-accent:#1a1220;
  --warn:#e2ac72; --warn-soft:#352a22; --danger:#e58b84; --danger-soft:#3a2229; --good:#8fcf9f;
  --pay:#8fb4dc; --pay-soft:#1f2b45;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.25);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.app{display:flex;min-height:100vh}
.side{display:none}
.main{flex:1;min-width:0;padding:16px 16px 120px;max-width:760px;margin:0 auto;width:100%}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:4px 0 18px}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:-.01em}
.brand-mark{width:34px;height:34px;border-radius:11px;background:var(--accent);display:grid;place-items:center;color:var(--on-accent)}
.hello h1{font-size:24px;margin:0;letter-spacing:-.02em;font-weight:800}
.hello p{margin:2px 0 0;color:var(--muted);font-size:14px}
.icon-btn{border:1px solid var(--line);background:var(--surface);width:40px;height:40px;border-radius:12px;display:grid;place-items:center}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow);margin-bottom:14px}
.card h2{font-size:16px;margin:0 0 12px;font-weight:700;display:flex;align-items:center;justify-content:space-between;gap:8px}
.card h2 small{font-weight:500;color:var(--muted);font-size:13px}
.hero{background:linear-gradient(150deg,var(--accent-soft),var(--surface) 70%);padding:22px}
.hero .label{font-size:13px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.hero .big{font-size:46px;font-weight:800;letter-spacing:-.03em;line-height:1.05;margin:6px 0 6px}
.hero .big.neg{color:var(--danger)}
.hero .sub{color:var(--muted);font-size:14px}
.pillrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:6px 11px;border-radius:999px;background:var(--surface2);font-size:13px;font-weight:600;color:var(--text)}
.pill.pay{background:var(--pay-soft);color:var(--pay)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.good{background:var(--accent-soft);color:var(--accent-strong)}
.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.act{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-sm);padding:14px 8px;display:flex;flex-direction:column;align-items:center;gap:6px;font-weight:600;font-size:13px;box-shadow:var(--shadow)}
.act .ic{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent-strong);font-size:18px}
.btn{border:0;border-radius:12px;padding:11px 16px;font-weight:700;background:var(--accent);color:var(--on-accent);display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.ghost{background:var(--surface2);color:var(--text)}
.btn.line{background:transparent;border:1px solid var(--line);color:var(--text)}
.btn.danger{background:var(--danger-soft);color:var(--danger)}
.btn.small{padding:7px 12px;font-size:13px;border-radius:10px}
.btn.block{width:100%}
.btn:disabled{opacity:.5}
.list{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row .em{width:38px;height:38px;border-radius:12px;background:var(--surface2);display:grid;place-items:center;font-size:18px;flex:none}
.row .grow{flex:1;min-width:0}
.row .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .s{font-size:13px;color:var(--muted)}
.row .amt{font-weight:700;white-space:nowrap}
.row.click{cursor:pointer}
.amt.in{color:var(--good)}
.muted{color:var(--muted)}
.tiny{font-size:12px}
.bar{height:8px;border-radius:99px;background:var(--surface2);overflow:hidden;margin-top:7px}
.bar>i{display:block;height:100%;border-radius:99px;background:var(--accent)}
.bar>i.warn{background:var(--warn)}
.bar>i.over{background:var(--danger)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.stat .k{font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.05em}
.stat .v{font-size:22px;font-weight:800;letter-spacing:-.02em;margin-top:2px}
.dots{display:flex;flex-wrap:wrap;gap:5px;margin-top:10px}
.dot{width:14px;height:14px;border-radius:5px;background:var(--surface2)}
.dot.on{background:var(--accent)}
.dot.today{outline:2px solid var(--accent);outline-offset:1px}
.banner{border-radius:var(--radius-sm);padding:14px 16px;margin-bottom:14px;display:flex;gap:12px;align-items:center;background:var(--warn-soft);color:var(--text)}
.banner.calm{background:var(--accent-soft)}
.banner.pay{background:var(--pay-soft)}
.banner .grow{flex:1}
.banner b{display:block}
.seg{display:flex;background:var(--surface2);border-radius:12px;padding:4px;gap:4px;margin-bottom:14px}
.seg button{flex:1;border:0;background:transparent;padding:9px;border-radius:9px;font-weight:700;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--text);box-shadow:var(--shadow)}
.monthbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.monthbar h3{margin:0;font-size:18px}
.summary{display:grid;grid-template-columns:repeat(2,1fr);gap:10px 16px}
.summary div{display:flex;justify-content:space-between;font-size:14px}
.summary .tot{grid-column:1/-1;border-top:1px solid var(--line);padding-top:10px;font-weight:800;font-size:16px}
/* calendar */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .dow{font-size:11px;text-align:center;color:var(--muted);font-weight:700;padding-bottom:4px}
.cal .d{aspect-ratio:1/1.05;border-radius:10px;background:var(--surface2);padding:4px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:2px;font-size:13px;font-weight:600;border:2px solid transparent;cursor:pointer;min-width:0}
.cal .d.out{background:transparent;cursor:default}
.cal .d.today{border-color:var(--accent)}
.cal .d.sel{background:var(--accent);color:var(--on-accent)}
.cal .marks{display:flex;gap:2px}
.m{width:8px;height:8px;border-radius:50%;flex:none}
.cal .m{width:6px;height:6px}
.m.bill{background:var(--warn)} .m.pay{background:var(--pay)} .m.spend{background:var(--muted)}
.cal .sp{font-size:9px;color:var(--muted);font-weight:600;white-space:nowrap;overflow:hidden;max-width:100%}
.cal .d.sel .sp{color:var(--on-accent)}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);margin-top:10px;flex-wrap:wrap}
.legend span{display:flex;align-items:center;gap:5px}
/* jars */
.jars{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.jar{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px;text-align:center;box-shadow:var(--shadow);cursor:pointer}
.jar svg{width:84px;height:100px;display:block;margin:0 auto 6px}
.jar .n{font-weight:700}
.jar .p{font-size:13px;color:var(--muted)}
.jar.add{display:grid;place-items:center;border-style:dashed;color:var(--muted);font-weight:700;min-height:180px;box-shadow:none;background:transparent}
/* nav */
.nav{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:6px 6px calc(6px + env(safe-area-inset-bottom));z-index:20}
.nav button{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:700;color:var(--muted);padding:6px 4px;min-width:56px;border-radius:12px}
.nav button.on{color:var(--accent-strong)}
.nav svg{width:22px;height:22px}
.fab{position:fixed;right:18px;bottom:calc(78px + env(safe-area-inset-bottom));width:60px;height:60px;border-radius:20px;border:0;background:var(--accent);color:var(--on-accent);box-shadow:0 10px 24px rgba(0,0,0,.18);display:grid;place-items:center;z-index:21}
.fab svg{width:28px;height:28px}
/* sheet */
.overlay{position:fixed;inset:0;background:rgba(10,14,25,.45);z-index:50;display:flex;align-items:flex-end;justify-content:center;animation:fade .15s}
.sheet{background:var(--surface);width:100%;max-width:520px;border-radius:24px 24px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom));max-height:92vh;overflow:auto;animation:up .2s ease-out}
.sheet h3{margin:0 0 4px;font-size:20px;letter-spacing:-.01em}
.sheet .lead{margin:0 0 16px;color:var(--muted);font-size:14px}
.grab{width:40px;height:5px;border-radius:9px;background:var(--line);margin:-6px auto 14px}
@keyframes up{from{transform:translateY(30px);opacity:0}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}
.field{margin-bottom:14px}
.field label{display:block;font-size:13px;font-weight:700;margin-bottom:6px}
.field .hint{font-size:12px;color:var(--muted);margin-top:4px}
.input,select.input,textarea.input{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface2);outline:none;font-size:16px}
.input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.amount-in{font-size:36px;font-weight:800;text-align:center;letter-spacing:-.02em;padding:14px;border:0;background:transparent;width:100%;outline:none}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--surface2);border-radius:999px;padding:8px 12px;font-weight:600;font-size:14px}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btnrow{display:flex;gap:10px;margin-top:8px}
.btnrow .btn{flex:1}
.switch{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.switch:first-of-type{border-top:0}
.toggle{width:48px;height:28px;border-radius:99px;background:var(--line);border:0;position:relative;flex:none;transition:.2s}
.toggle::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.toggle.on{background:var(--accent)}
.toggle.on::after{left:23px}
.toast{position:fixed;left:50%;bottom:calc(150px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--text);color:var(--bg);padding:12px 18px;border-radius:14px;font-weight:600;font-size:14px;z-index:80;box-shadow:var(--shadow);animation:up .2s;max-width:90vw;text-align:center}
.empty{text-align:center;padding:18px 8px;color:var(--muted)}
.empty b{display:block;color:var(--text);margin-bottom:4px}
.onb{max-width:460px;margin:0 auto;padding:28px 16px 40px;min-height:100vh;display:flex;flex-direction:column;justify-content:center}
.onb .logo{width:64px;height:64px;border-radius:20px;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;margin-bottom:18px}
.onb h1{font-size:30px;letter-spacing:-.03em;margin:0 0 8px;line-height:1.15}
.onb p.lead{color:var(--muted);margin:0 0 22px}
.steps{display:flex;gap:6px;margin-bottom:22px}
.steps i{height:5px;flex:1;border-radius:9px;background:var(--line)}
.steps i.on{background:var(--accent)}
.opt{border:1.5px solid var(--line);background:var(--surface);border-radius:16px;padding:14px;text-align:left;width:100%;margin-bottom:10px;display:flex;gap:12px;align-items:flex-start}
.opt.on{border-color:var(--accent);background:var(--accent-soft)}
.opt b{display:block}
.opt span{font-size:13px;color:var(--muted)}
.demo-bar{background:var(--pay-soft);color:var(--text);text-align:center;font-size:13px;padding:8px 12px;font-weight:600}
.demo-bar a{color:var(--pay);font-weight:800}
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-size:18px;font-family:inherit}
.spoon .hero{text-align:center;padding:36px 20px}
.spoon .hero .big{font-size:60px}
.spoon .bigbtn{font-size:18px;padding:18px;border-radius:18px}
.focus{border:1.5px solid var(--accent);background:var(--accent-soft)}
.tag{display:inline-block;font-size:11px;font-weight:800;padding:3px 8px;border-radius:99px;background:var(--accent);color:var(--on-accent);margin-left:6px;vertical-align:middle;text-transform:uppercase;letter-spacing:.04em}
.section-title{font-size:13px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;margin:22px 0 10px}
ol.how{margin:0 0 16px;padding:0;list-style:none;counter-reset:st}
ol.how li{counter-increment:st;display:flex;gap:12px;padding:8px 0;font-size:14px}
ol.how li::before{content:counter(st);flex:none;width:26px;height:26px;border-radius:50%;background:var(--accent-soft);color:var(--accent-strong);font-weight:800;display:grid;place-items:center;font-size:13px}
.note{background:var(--surface2);border-radius:12px;padding:10px 12px;font-size:13px;color:var(--muted);margin:10px 0}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:90}
@media (min-width: 900px){
  .side{display:flex;flex-direction:column;gap:4px;width:240px;flex:none;padding:24px 16px;border-right:1px solid var(--line);position:sticky;top:0;height:100vh;background:var(--surface)}
  .side .brand{margin:0 8px 22px}
  .side button.nv{border:0;background:transparent;display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:12px;font-weight:700;color:var(--muted);text-align:left}
  .side button.nv.on{background:var(--accent-soft);color:var(--accent-strong)}
  .side button.nv svg{width:20px;height:20px}
  .side .btn{margin-top:16px}
  .nav,.fab{display:none}
  .main{padding:32px 32px 60px}
  .overlay{align-items:center}
  .sheet{border-radius:24px}
  .toast{bottom:40px}
}
@media (max-width:380px){ .hero .big{font-size:40px} .act{font-size:12px} }
</style>
</head>
<body>
<div id="root"></div>
<canvas id="confetti"></canvas>
<script>
/* =========================================================
   Calm Cash Planner  v1.0
   Single-file, offline-first budget planner.
   All data stays on the user's device (localStorage).
   ========================================================= */

/* ---- Seller settings ---- */
const DEMO_MODE = false;            // true = free demo build (sample data, nothing saved)
const FULL_VERSION_LINK = "";       // your Etsy listing link, shown in demo mode
const APP_VERSION = "1.2";

/* ---- Utilities ---- */
const $ = (s, el = document) => el.querySelector(s);
const uid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);
const pad = n => String(n).padStart(2, "0");
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parseD = s => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };
const todayStr = () => ymd(new Date());
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const mkey = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}`;
const dim = (y, m) => new Date(y, m + 1, 0).getDate();
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const num = v => { const n = parseFloat(String(v ?? "").replace(/\s/g, "").replace(",", ".")); return isFinite(n) ? n : 0; };
const round2 = n => Math.round(n * 100) / 100;
const sum = (a, f = x => x) => a.reduce((t, x) => t + f(x), 0);
const daysBetween = (a, b) => Math.round((parseD(b) - parseD(a)) / 86400000);

const CURRENCIES_POPULAR = ["USD","EUR","GBP","CAD","AUD"];
const CURRENCIES = [
  ["AED","UAE Dirham"],["ARS","Argentine Peso"],["AUD","Australian Dollar"],["BGN","Bulgarian Lev"],["BRL","Brazilian Real"],
  ["CAD","Canadian Dollar"],["CHF","Swiss Franc"],["CLP","Chilean Peso"],["CNY","Chinese Yuan"],["COP","Colombian Peso"],
  ["CZK","Czech Koruna"],["DKK","Danish Krone"],["EGP","Egyptian Pound"],["EUR","Euro"],["GBP","British Pound"],
  ["GHS","Ghanaian Cedi"],["HKD","Hong Kong Dollar"],["HUF","Hungarian Forint"],["IDR","Indonesian Rupiah"],["ILS","Israeli Shekel"],
  ["INR","Indian Rupee"],["ISK","Icelandic Krona"],["JPY","Japanese Yen"],["KES","Kenyan Shilling"],["KRW","South Korean Won"],
  ["KWD","Kuwaiti Dinar"],["MAD","Moroccan Dirham"],["MXN","Mexican Peso"],["MYR","Malaysian Ringgit"],["NGN","Nigerian Naira"],
  ["NOK","Norwegian Krone"],["NZD","New Zealand Dollar"],["OMR","Omani Rial"],["PEN","Peruvian Sol"],["PHP","Philippine Peso"],
  ["PKR","Pakistani Rupee"],["PLN","Polish Zloty"],["QAR","Qatari Riyal"],["RON","Romanian Leu"],["SAR","Saudi Riyal"],
  ["SEK","Swedish Krona"],["SGD","Singapore Dollar"],["THB","Thai Baht"],["TRY","Turkish Lira"],["TWD","Taiwan Dollar"],
  ["TZS","Tanzanian Shilling"],["UGX","Ugandan Shilling"],["USD","US Dollar"],["VND","Vietnamese Dong"],["ZAR","South African Rand"]
];
function currencyOptions(sel) {
  const name = c => (CURRENCIES.find(x => x[0] === c) || [c, c])[1];
  const opt = c => `<option value="${c}" ${sel === c ? "selected" : ""}>${c} · ${name(c)}</option>`;
  return `<optgroup label="Most used">${CURRENCIES_POPULAR.map(opt).join("")}</optgroup><optgroup label="All currencies">${CURRENCIES.filter(x => !CURRENCIES_POPULAR.includes(x[0])).map(x => opt(x[0])).join("")}</optgroup>`;
}
const DEFAULT_CATS = [
  ["Groceries","🛒",300],["Eating out & coffee","☕",120],["Transport","🚌",90],["Shopping","🛍️",100],
  ["Fun & hobbies","🎉",60],["Self-care","🌿",50],["Home","🏠",40],["Other","✨",50]
];
const EMOJIS = "🛒☕🚌🛍️🎉🌿🏠✨🍔🚗⛽💊🐶👶🎁📚💻📱✈️🏖️💡🧾🎮🎬💄👗🏋️🧸🪴💍🎓🏥🔧🍷🥗🚕🛡️🐱💳🏦🎵".match(/\p{Extended_Pictographic}️?/gu);

let fmtCache = {};
function money(n, opts = {}) {
  const cur = S.setup.currency || "EUR";
  const key = cur + (opts.short ? "s" : "");
  if (!fmtCache[key]) {
    try {
      fmtCache[key] = new Intl.NumberFormat(undefined, opts.short ? { style: "currency", currency: cur, maximumFractionDigits: 0, minimumFractionDigits: 0 } : { style: "currency", currency: cur });
    } catch (e) { fmtCache[key] = { format: v => cur + " " + v.toFixed(opts.short ? 0 : 2) }; }
  }
  return fmtCache[key].format(round2(n || 0));
}
const fmtDate = (s, o = { weekday: "short", day: "numeric", month: "short" }) => parseD(s).toLocaleDateString(undefined, o);
const monthName = (k, o = { month: "long", year: "numeric" }) => { const [y, m] = k.split("-").map(Number); return new Date(y, m - 1, 1).toLocaleDateString(undefined, o); };

/* ---- Storage ---- */
const KEY = "calmcash_v1";
function fresh() {
  return {
    v: 1,
    setup: { done: false, name: "", currency: "EUR", incomeType: "regular", payFreq: "monthly", payAmount: 0, nextPayday: todayStr() },
    settings: { theme: "auto", lowSpoons: false, debtStrategy: "avalanche", debtExtra: 0, lastBackup: null },
    categories: DEFAULT_CATS.map(([name, emoji, budget]) => ({ id: uid(), name, emoji, budget })),
    tx: [], bills: [], funds: [], debts: [], checkins: [],
    ui: { tab: "today", goalTab: "save", month: mkey(new Date()), calSel: todayStr() }
  };
}
let S;
function load() {
  if (DEMO_MODE) return null;
  try { const raw = localStorage.getItem(KEY); return raw ? JSON.parse(raw) : null; } catch (e) { return null; }
}
function save() {
  if (DEMO_MODE) return;
  try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { /* storage unavailable */ }
}
function migrate(d) {
  const base = fresh();
  const out = Object.assign(base, d);
  out.setup = Object.assign(fresh().setup, d.setup || {});
  out.settings = Object.assign(fresh().settings, d.settings || {});
  out.ui = Object.assign(fresh().ui, d.ui || {}, { month: mkey(new Date()), calSel: todayStr() });
  ["tx","bills","funds","debts","checkins","categories"].forEach(k => { if (!Array.isArray(out[k])) out[k] = []; });
  return out;
}

/* ---- Money engine ---- */
function paydaysBetween(startS, endS) {
  const st = S.setup;
  if (st.incomeType !== "regular" || !st.nextPayday) return [];
  const start = parseD(startS), end = parseD(endS), base = parseD(st.nextPayday), out = [];
  if (st.payFreq === "weekly" || st.payFreq === "biweekly") {
    const step = st.payFreq === "weekly" ? 7 : 14;
    let d = new Date(base);
    while (d > start) d = addDays(d, -step);
    while (d <= end) { if (d >= start) out.push(ymd(d)); d = addDays(d, step); }
  } else {
    let y = start.getFullYear(), m = start.getMonth();
    while (new Date(y, m, 1) <= end) {
      const days = st.payFreq === "semimonthly" ? [1, 15] : [base.getDate()];
      days.forEach(dd => { const d = new Date(y, m, Math.min(dd, dim(y, m))); if (d >= start && d <= end) out.push(ymd(d)); });
      m++; if (m > 11) { m = 0; y++; }
    }
  }
  return out;
}
function nextPayday() {
  const t = todayStr();
  const list = paydaysBetween(t, ymd(addDays(new Date(), 62)));
  return list[0] || null;
}
function billDatesInMonth(b, k) {
  const [y, m] = k.split("-").map(Number);
  if (b.freq === "yearly" && Number(b.month) !== m) return [];
  return [`${y}-${pad(m)}-${pad(Math.min(Number(b.dueDay) || 1, dim(y, m - 1)))}`];
}
function billsInMonth(k) {
  const out = [];
  S.bills.forEach(b => billDatesInMonth(b, k).forEach(date => out.push({ b, date, paid: !!(b.paid && b.paid[k]) })));
  return out.sort((a, b) => a.date.localeCompare(b.date));
}
const inMonth = (dateS, k) => dateS && dateS.slice(0, 7) === k;
function calcMonth(k) {
  const [y, m] = k.split("-").map(Number);
  const first = `${k}-01`, last = `${k}-${pad(dim(y, m - 1))}`;
  const tx = S.tx.filter(t => inMonth(t.date, k));
  const logged = sum(tx.filter(t => t.type === "income"), t => t.amount);
  const paydays = paydaysBetween(first, last);
  const expected = S.setup.incomeType === "regular" ? paydays.length * num(S.setup.payAmount) : 0;
  const income = Math.max(expected, logged);
  const bills = sum(billsInMonth(k), x => num(x.b.amount));
  const savings = sum(S.funds, f => Math.max(num(f.plan), sum((f.history || []).filter(h => inMonth(h.date, k)), h => h.amount)));
  const debtMin = sum(S.debts.filter(d => d.balance > 0 || (d.payments || []).some(p => inMonth(p.date, k))), d => num(d.min)) + num(S.settings.debtExtra);
  const debtPaid = sum(S.debts, d => sum((d.payments || []).filter(p => inMonth(p.date, k)), p => p.amount));
  const debt = Math.max(debtMin, debtPaid);
  const spent = sum(tx.filter(t => t.type === "expense"), t => t.amount);
  const left = income - bills - savings - debt - spent;
  return { income, expected, logged, bills, savings, debt, spent, left, paydays, tx };
}
function safeToday() {
  const now = new Date(), k = mkey(now), c = calcMonth(k), t = todayStr();
  const daysLeft = dim(now.getFullYear(), now.getMonth()) - now.getDate() + 1;
  const spentToday = sum(c.tx.filter(x => x.type === "expense" && x.date === t), x => x.amount);
  const perDayStart = (c.left + spentToday) / daysLeft;
  return { c, daysLeft, spentToday, today: perDayStart - spentToday, perDay: perDayStart };
}
function catSpent(k, catId) { return sum(S.tx.filter(t => t.type === "expense" && t.catId === catId && inMonth(t.date, k)), t => t.amount); }
const cat = id => S.categories.find(c => c.id === id) || { name: "Other", emoji: "✨" };

/* ---- Debt simulator ---- */
function simulateDebts(extra, strategy) {
  let ds = S.debts.filter(d => d.balance > 0).map(d => ({ id: d.id, bal: num(d.balance), rate: num(d.rate) / 1200, min: Math.max(num(d.min), 1) }));
  if (!ds.length) return { months: 0, interest: 0, order: [], done: {} };
  const order = [...ds].sort((a, b) => strategy === "snowball" ? a.bal - b.bal : (b.rate - a.rate) || (a.bal - b.bal)).map(d => d.id);
  let months = 0, interest = 0; const done = {};
  const budget = sum(ds, d => d.min) + num(extra);
  while (ds.some(d => d.bal > 0.005) && months < 600) {
    months++;
    ds.forEach(d => { if (d.bal > 0) { const i = d.bal * d.rate; interest += i; d.bal += i; } });
    let pool = budget;
    ds.forEach(d => { if (d.bal > 0) { const p = Math.min(d.min, d.bal); d.bal -= p; pool -= p; } });
    for (const id of order) { const d = ds.find(x => x.id === id); if (d.bal > 0 && pool > 0) { const p = Math.min(pool, d.bal); d.bal -= p; pool -= p; } }
    ds.forEach(d => { if (d.bal <= 0.005 && !done[d.id]) done[d.id] = months; });
  }
  return { months: months >= 600 ? Infinity : months, interest, order, done };
}

/* ---- Check-ins (gentle streak) ---- */
function checkin(dateS = todayStr()) { if (!S.checkins.includes(dateS)) S.checkins.push(dateS); }
function rhythm() {
  const set = new Set(S.checkins);
  let d = new Date(), count = 0, miss = 0;
  if (!set.has(ymd(d))) d = addDays(d, -1);
  while (miss < 2 && count < 3650) {
    if (set.has(ymd(d))) { count++; miss = 0; } else miss++;
    d = addDays(d, -1);
  }
  return count;
}
function lastActivity() { const s = [...S.checkins].sort(); return s[s.length - 1] || null; }

    }).join("")}</div>
    <button class="btn ghost block" style="margin-top:12px" data-act="editCat">＋ Add category</button></div>`;
  const tx = [...c.tx].sort((a, b) => b.date.localeCompare(a.date) || (b.ts || 0) - (a.ts || 0));

  return head + mb + sm + cats + txs;
}

/* ---------- Calendar ---------- */

  const first = new Date(y, m - 1, 1), offset = (first.getDay() + 6) % 7, days = dim(y, m - 1);
  const bills = billsInMonth(k), pays = new Set(paydaysBetween(`${k}-01`, `${k}-${pad(days)}`));
  const spendBy = {};
  S.tx.filter(x => x.type === "expense" && inMonth(x.date, k)).forEach(x => spendBy[x.date] = (spendBy[x.date] || 0) + x.amount);

      ...dBills.map(x => `<div class="row"><div class="em" style="background:var(--warn-soft)">${esc(x.b.emoji || "🧾")}</div><div class="grow"><div class="t">${esc(x.b.name)}</div><div class="s">Bill</div></div><div style="text-align:right"><div class="amt">${money(x.b.amount)}</div>${x.paid ? `<button class="btn small ghost" data-act="payBill" data-id="${x.b.id}" data-k="${k}" style="margin-top:4px">Paid ✓</button>` : `<button class="btn small" data-act="payBill" data-id="${x.b.id}" data-k="${k}" style="margin-top:4px">Mark paid</button>`}</div></div>`),

  }

    ${S.bills.length ? `<div class="list">${[...S.bills].sort((a, b) => (a.dueDay || 0) - (b.dueDay || 0)).map(b => {

/* ---------- Goals ---------- */
function jarSVG(pct, done) {
  const p = Math.max(0, Math.min(1, pct)), h = 64 * p, y = 88 - h;
  const id = "j" + Math.random().toString(36).slice(2, 7);
  return `<svg viewBox="0 0 84 100" aria-hidden="true"><defs><clipPath id="${id}"><path d="M18 24h48v4c6 4 8 10 8 18v34c0 6-4 10-10 10H20c-6 0-10-4-10-10V46c0-8 2-14 8-18z"/></clipPath></defs>
  <rect x="22" y="12" width="40" height="10" rx="3" fill="var(--line)"/>
  <g clip-path="url(#${id})"><rect x="0" y="0" width="84" height="100" fill="var(--surface2)"/><rect x="0" y="${y}" width="84" height="${h + 10}" fill="${done ? "var(--good)" : "var(--accent)"}" opacity=".85"/>${p > 0 ? `<path d="M0 ${y} q10 -4 21 0 t21 0 t21 0 t21 0 v6 H0z" fill="${done ? "var(--good)" : "var(--accent)"}"/>` : ""}</g>
  <path d="M18 24h48v4c6 4 8 10 8 18v34c0 6-4 10-10 10H20c-6 0-10-4-10-10V46c0-8 2-14 8-18z" fill="none" stroke="var(--muted)" stroke-opacity=".5" stroke-width="2"/>
  ${done ? `<text x="42" y="64" text-anchor="middle" font-size="22">✓</text>` : ""}</svg>`;
}
function renderGoals() {
  const g = S.ui.goalTab;
  const head = topbar("Goals", "Savings jars and debt payoff");
  const seg = `<div class="seg"><button class="${g === "save" ? "on" : ""}" data-act="goalTab" data-g="save">Savings jars</button><button class="${g === "debt" ? "on" : ""}" data-act="goalTab" data-g="debt">Debt payoff</button></div>`;
  if (g === "save") {
    const saved = sum(S.funds, f => num(f.saved)), plan = sum(S.funds, f => num(f.plan));
    return head + seg + `<div class="card grid2" style="margin-bottom:14px"><div class="stat"><div class="k">Total saved</div><div class="v">${money(saved)}</div></div><div class="stat"><div class="k">Monthly plan</div><div class="v">${money(plan)}</div></div></div>
    <div class="jars">${S.funds.map(f => {
      const pct = num(f.target) ? num(f.saved) / num(f.target) : 0, done = pct >= 1;
      let eta = "";
      if (!done && num(f.plan) > 0 && num(f.target)) { const mo = Math.ceil((num(f.target) - num(f.saved)) / num(f.plan)); const d = new Date(); d.setMonth(d.getMonth() + mo); eta = `Ready ~${d.toLocaleDateString(undefined, { month: "short", year: "numeric" })}`; }
      return `<div class="jar" data-act="fund" data-id="${f.id}">${jarSVG(pct, done)}<div class="n">${esc(f.emoji || "")} ${esc(f.name)}</div><div class="p">${money(f.saved, { short: true })} of ${money(f.target, { short: true })}</div><div class="tiny" style="color:var(--accent-strong);font-weight:700;margin-top:4px">${done ? "Goal reached!" : Math.round(pct * 100) + "%" + (eta ? " · " + eta : "")}</div></div>`;
    }).join("")}<button class="jar add" data-act="editFund">＋<br>New jar</button></div>`;
  }
  // debt
  const sim = simulateDebts(S.settings.debtExtra, S.settings.debtStrategy);
  const total = sum(S.debts, d => num(d.balance)), startT = sum(S.debts, d => num(d.start || d.balance));
  const free = sim.months && isFinite(sim.months) ? (() => { const d = new Date(); d.setMonth(d.getMonth() + sim.months); return d.toLocaleDateString(undefined, { month: "long", year: "numeric" }); })() : null;
  const focusId = sim.order.find(id => (S.debts.find(d => d.id === id) || {}).balance > 0);
  const strat = `<div class="card"><h2>Your payoff plan</h2>
    <div class="grid2" style="margin-bottom:12px"><div class="stat"><div class="k">Left to pay</div><div class="v">${money(total)}</div></div><div class="stat"><div class="k">Debt-free by</div><div class="v" style="font-size:18px">${S.debts.length ? (free || (sim.months === 0 ? "Done!" : "Raise payments")) : "-"}</div></div></div>
    <div class="bar" style="height:12px"><i style="width:${startT ? (startT - total) / startT * 100 : 0}%"></i></div>
    <div class="tiny muted" style="margin:6px 0 14px">${startT ? Math.round((startT - total) / startT * 100) : 0}% paid off${sim.interest && isFinite(sim.months) ? ` · about ${money(sim.interest, { short: true })} interest still to come` : ""}</div>
    <div class="seg" style="margin-bottom:10px"><button class="${S.settings.debtStrategy === "avalanche" ? "on" : ""}" data-act="strategy" data-s="avalanche">Highest interest first</button><button class="${S.settings.debtStrategy === "snowball" ? "on" : ""}" data-act="strategy" data-s="snowball">Smallest balance first</button></div>
    <div class="tiny muted" style="margin-bottom:12px">${S.settings.debtStrategy === "avalanche" ? "Saves the most money on interest." : "Quick wins that keep you motivated."}</div>
    <div class="field" style="margin:0"><label>Extra I can pay each month</label><input class="input" inputmode="decimal" value="${num(S.settings.debtExtra) || ""}" placeholder="0" data-change="debtExtra"><div class="hint">Even a small extra amount shortens the plan. It's set aside in your monthly budget.</div></div>
  </div>`;
  const list = `<div class="card"><h2>Your debts</h2>${S.debts.length ? `<div class="list">${sim.order.concat(S.debts.filter(d => !sim.order.includes(d.id)).map(d => d.id)).map(id => {
    const d = S.debts.find(x => x.id === id); if (!d) return "";
    const st = num(d.start || d.balance), pct = st ? (st - num(d.balance)) / st * 100 : 100, focus = id === focusId;
    const doneM = sim.done[id];
    return `<div class="row click ${focus ? "" : ""}" data-act="debt" data-id="${id}" style="${focus ? "background:var(--accent-soft);border-radius:14px;padding:12px;border-top:0;margin:4px 0" : ""}"><div class="em">${esc(d.emoji || "💳")}</div><div class="grow"><div class="t">${esc(d.name)}${focus ? '<span class="tag">Focus</span>' : ""}</div><div class="s">${num(d.rate)}% · min ${money(d.min)}${num(d.balance) <= 0 ? " · Paid off 🎉" : doneM ? ` · gone in ${doneM} mo` : ""}</div><div class="bar"><i style="width:${pct}%"></i></div></div><div class="amt">${money(d.balance)}</div></div>`;
  }).join("")}</div>` : `<div class="empty"><b>No debts added</b>Add a credit card, loan or buy-now-pay-later to see your debt-free date.</div>`}
  <button class="btn ghost block" style="margin-top:12px" data-act="editDebt">＋ Add debt</button></div>`;
  return head + seg + strat + list;
}

/* ---------- More (year, settings, backup) ---------- */
function yearChart(y) {
  const now = new Date(), data = [];
  for (let m = 1; m <= 12; m++) {
    const k = `${y}-${pad(m)}`;
    if (new Date(y, m - 1, 1) > now) { data.push({ m, inc: 0, out: 0, future: true }); continue; }
    const c = calcMonth(k);
    const out = c.spent + sum(billsInMonth(k), b => num(b.b.amount));
    data.push({ m, inc: c.income, out });
  }
  const max = Math.max(1, ...data.map(d => Math.max(d.inc, d.out)));
  const W = 600, H = 200, bw = 16, gap = W / 12;
  const bars = data.map((d, i) => {
    const x = i * gap + gap / 2;
    const hi = d.inc / max * (H - 30), ho = d.out / max * (H - 30);
    return `<rect x="${x - bw - 1}" y="${H - 20 - hi}" width="${bw}" height="${hi}" rx="4" fill="var(--accent)"/><rect x="${x + 1}" y="${H - 20 - ho}" width="${bw}" height="${ho}" rx="4" fill="var(--warn)" opacity=".85"/><text x="${x}" y="${H - 4}" text-anchor="middle" font-weight="700">${new Date(y, i, 1).toLocaleDateString(undefined, { month: "narrow" })}</text>`;
  }).join("");
  const totIn = sum(data, d => d.inc), totOut = sum(data, d => d.out);
  return { svg: `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Income and spending by month">${bars}</svg>`, totIn, totOut };
}

function guessCurrency() {
  try { const r = new Intl.NumberFormat().resolvedOptions().locale || ""; const reg = (r.split("-")[1] || "").toUpperCase();
    const map = { US: "USD", GB: "GBP", CA: "CAD", AU: "AUD", NZ: "NZD", CH: "CHF", TZ: "TZS", KE: "KES", NG: "NGN", ZA: "ZAR", AE: "AED", SA: "SAR", OM: "OMR", IN: "INR", JP: "JPY", MX: "MXN", BR: "BRL", SE: "SEK", NO: "NOK", DK: "DKK", PL: "PLN", UG: "UGX", GH: "GHS", EG: "EGP", MA: "MAD", QA: "QAR", KW: "KWD", PK: "PKR", MY: "MYR", SG: "SGD", PH: "PHP", TR: "TRY", HK: "HKD", ID: "IDR", IL: "ILS", VN: "VND", KR: "KRW", CN: "CNY", TW: "TWD", TH: "THB", CZ: "CZK", HU: "HUF", RO: "RON", BG: "BGN", IS: "ISK", CL: "CLP", CO: "COP", PE: "PEN", AR: "ARS" };
    return map[reg] || "EUR"; } catch (e) { return "EUR"; }
}

function sampleData() {
  const s = fresh();
  const now = new Date(), y = now.getFullYear(), m = now.getMonth();
  s.setup = { done: true, name: "Sam", currency: S && S.setup.currency || guessCurrency(), incomeType: "regular", payFreq: "biweekly", payAmount: 1450, nextPayday: ymd(addDays(now, 4)) };
  const C = s.categories, cid = n => C.find(c => c.name.startsWith(n)).id;
  const spends = [["Groceries", 42, 68, "Weekly shop"], ["Eating out", 4, 14, "Coffee"], ["Transport", 15, 30, "Bus pass top-up"], ["Shopping", 20, 55, "Clothes"], ["Fun", 12, 35, "Cinema"], ["Self-care", 15, 30, "Pharmacy"], ["Home", 8, 20, "Cleaning bits"]];
  let seed = 7; const rnd = () => (seed = (seed * 9301 + 49297) % 233280) / 233280;
  for (let back = 9; back >= 0; back--) {
    const mm = new Date(y, m - back, 1), k = mkey(mm), last = back === 0 ? now.getDate() : dim(mm.getFullYear(), mm.getMonth());
    for (let d = 1; d <= last; d++) {
      const ds = `${k}-${pad(d)}`;
      if (rnd() < 0.85) s.checkins.push(ds);
      spends.forEach(([n, lo, hi, note]) => { const p = n === "Groceries" ? 0.14 : n === "Eating out" ? 0.35 : 0.08; if (rnd() < p) s.tx.push({ id: uid(), type: "expense", amount: round2(lo + rnd() * (hi - lo)), catId: cid(n), note, date: ds, ts: 0 }); });
    }
    if (back > 0) [8, 22].forEach(d => s.tx.push({ id: uid(), type: "income", amount: 1450, catId: null, note: "Paycheck", date: `${k}-${pad(d)}`, ts: 0 }));
  }
  const k = mkey(now);
  s.bills = [["Rent","🏠",850,1],["Gym","🏋️",30,5],["Phone","📱",25,12],["Internet","💡",35,18],["Streaming","🎬",12,22],["Car insurance","🚗",420,3,"yearly",m + 1]]
    .map(([name, emoji, amount, dueDay, freq = "monthly", month = 1]) => ({ id: uid(), name, emoji, amount, dueDay, freq, month, paid: {} }));
  s.bills.forEach(b => { for (let back = 1; back <= 9; back++) b.paid[mkey(new Date(y, m - back, 1))] = true; if (b.dueDay < now.getDate()) b.paid[k] = true; });
  s.funds = [
    { id: uid(), name: "Emergency fund", emoji: "🛡️", target: 3000, saved: 1240, plan: 150, history: [{ date: `${k}-02`, amount: 150 }] },
    { id: uid(), name: "Summer trip", emoji: "✈️", target: 1200, saved: 480, plan: 80, history: [] },
    { id: uid(), name: "New laptop", emoji: "💻", target: 900, saved: 900, plan: 0, history: [] }
  ];
  s.debts = [
    { id: uid(), name: "Credit card", emoji: "💳", balance: 1860, start: 2400, rate: 19.9, min: 60, payments: [] },
    { id: uid(), name: "Student loan", emoji: "🎓", balance: 7900, start: 8200, rate: 4.5, min: 120, payments: [] },
    { id: uid(), name: "Phone plan", emoji: "📱", balance: 240, start: 480, rate: 0, min: 20, payments: [] }
  ];
  s.settings.debtExtra = 50;
  s.settings.lastBackup = todayStr();
  return s;
}

/* ---- Sheets / forms ---- */
function openSheet(html, mount) {
  closeSheet();
  const o = document.createElement("div");
  o.className = "overlay"; o.id = "overlay";
  o.innerHTML = `<div class="sheet" role="dialog" aria-modal="true"><div class="grab"></div>${html}</div>`;
  o.addEventListener("click", e => { if (e.target === o) closeSheet(); });
  document.body.appendChild(o);
  mount && mount(o);
}
function closeSheet() { const o = $("#overlay"); if (o) o.remove(); }
function toast(msg) {
  document.querySelectorAll(".toast").forEach(t => t.remove());
  const t = document.createElement("div"); t.className = "toast"; t.textContent = msg; document.body.appendChild(t);
  setTimeout(() => t.remove(), 2600);
}
function confirmSheet(title, text, okLabel, onOk, danger) {
  openSheet(`<h3>${title}</h3><p class="lead">${text}</p><div class="btnrow"><button class="btn ghost" id="cNo">Cancel</button><button class="btn ${danger ? "danger" : ""}" id="cYes">${okLabel}</button></div>`, o => {
    $("#cNo", o).onclick = closeSheet; $("#cYes", o).onclick = () => { closeSheet(); onOk(); };
  });
}
function emojiPicker(current) {
  return `<div class="chips" id="emo" style="max-height:120px;overflow:auto">${EMOJIS.map(e => `<button type="button" class="chip ${e === current ? "on" : ""}" data-e="${e}" style="padding:6px 9px">${e}</button>`).join("")}</div>`;
}
function bindEmoji(o, init) {
  let val = init;
  o.querySelectorAll("#emo .chip").forEach(b => b.onclick = () => { o.querySelectorAll("#emo .chip").forEach(x => x.classList.remove("on")); b.classList.add("on"); val = b.dataset.e; });
  return () => val;
}

function txSheet(opts = {}) {

  const date = ex ? ex.date : (opts.date || todayStr());
  const draw = () => `
    <div class="seg"><button type="button" class="${type === "expense" ? "on" : ""}" data-t="expense">Spent</button><button type="button" class="${type === "income" ? "on" : ""}" data-t="income">Received</button></div>
    <input class="amount-in" id="tAmt" inputmode="decimal" placeholder="${money(0)}" value="${ex ? ex.amount : ""}" aria-label="Amount">
    ${type === "expense" ? `<div class="field"><label>Category</label><div class="chips" id="tCats">${S.categories.map(c => `<button type="button" class="chip ${c.id === catId ? "on" : ""}" data-c="${c.id}">${esc(c.emoji)} ${esc(c.name)}</button>`).join("")}</div></div>` : ""}

  openSheet(`<h3>${ex ? "Edit entry" : type === "income" ? "Add income" : "Log spending"}</h3><p class="lead">${ex ? "" : "Quick is better than perfect."}</p><div id="tBody">${draw()}</div>`, o => {
    const bind = () => {
      const body = $("#tBody", o);
      body.querySelectorAll("[data-t]").forEach(b => b.onclick = () => { const a = $("#tAmt", o).value, n = $("#tNote", o).value, d = $("#tDate", o).value; type = b.dataset.t; body.innerHTML = draw(); $("#tAmt", o).value = a; $("#tNote", o).value = n; $("#tDate", o).value = d; bind(); });
      body.querySelectorAll("[data-c]").forEach(b => b.onclick = () => { body.querySelectorAll("[data-c]").forEach(x => x.classList.remove("on")); b.classList.add("on"); catId = b.dataset.c; });
      const cancel = $("#tCancel", o); if (cancel) cancel.onclick = closeSheet;
      const del = $("#tDel", o); if (del) del.onclick = () => { S.tx = S.tx.filter(t => t.id !== ex.id); save(); closeSheet(); render(); toast("Entry deleted"); };
      $("#tSave", o).onclick = () => {
        const amount = round2(num($("#tAmt", o).value));
        if (amount <= 0) { $("#tAmt", o).focus(); toast("Add an amount first"); return; }
        const rec = { type, amount, catId: type === "expense" ? catId : null, note: $("#tNote", o).value.trim(), date: $("#tDate", o).value || todayStr() };
        if (ex) Object.assign(ex, rec); else S.tx.push({ id: uid(), ts: Date.now(), ...rec });
        checkin(rec.date === todayStr() ? rec.date : todayStr());
        save(); closeSheet(); render();

function fundActions(id) {
  const f = S.funds.find(x => x.id === id); if (!f) return;
  const left = Math.max(0, num(f.target) - num(f.saved));
  openSheet(`<h3>${esc(f.emoji || "")} ${esc(f.name)}</h3><p class="lead">${money(f.saved)} saved of ${money(f.target)}${left ? ` · ${money(left)} to go` : " · Goal reached!"}</p>
    <input class="amount-in" id="fAmt" inputmode="decimal" placeholder="${money(f.plan || 0)}" aria-label="Amount">
    <div class="btnrow"><button class="btn ghost" id="fOut">Take out</button><button class="btn" id="fIn">Add money</button></div>
    <button class="btn line block" style="margin-top:10px" id="fEdit">Edit jar</button>`, o => {
    setTimeout(() => $("#fAmt", o).focus(), 60);
    const go = sign => {
      const a = round2(num($("#fAmt", o).value) || (sign > 0 ? num(f.plan) : 0));
      if (a <= 0) { toast("Add an amount first"); return; }
      const before = num(f.saved);
      f.saved = round2(Math.max(0, before + sign * a));
      (f.history = f.history || []).push({ date: todayStr(), amount: sign * a });
      checkin(); save(); closeSheet(); render();
      if (sign > 0 && before < num(f.target) && f.saved >= num(f.target) && num(f.target) > 0) { confetti(); toast(`You did it! ${f.name} is fully funded 🎉`); }
      else if (sign > 0) { confetti(40); toast(`${money(a)} added to ${f.name}`); }
      else toast(`${money(a)} taken out. No shame, that's what it's for.`);
    };
    $("#fIn", o).onclick = () => go(1); $("#fOut", o).onclick = () => go(-1); $("#fEdit", o).onclick = () => fundSheet(id);
  });
}

  const missedBills = billsInMonth(k).filter(x => !x.paid && x.date <= t);
  openSheet(`<h3>Let's catch up 🌿</h3><p class="lead">${la ? `Your last check-in was ${relDay(la).toLowerCase()}.` : ""} Rough guesses are perfect. Skip anything you don't know.</p>
    <div class="section-title" style="margin-top:0">Roughly what did you spend?</div>
    <div class="list">${S.categories.map(c => `<div class="row" style="padding:7px 0"><div class="em">${esc(c.emoji)}</div><div class="grow t">${esc(c.name)}</div><input class="input" style="width:110px;text-align:right" inputmode="decimal" placeholder="0" data-cu="${c.id}"></div>`).join("")}</div>
    ${missedBills.length ? `<div class="section-title">Which bills went out?</div><div class="list">${missedBills.map(x => `<label class="row" style="cursor:pointer"><input type="checkbox" data-bill="${x.b.id}" checked style="width:20px;height:20px;accent-color:var(--accent)"><div class="grow t">${esc(x.b.name)}</div><div class="amt">${money(x.b.amount)}</div></label>`).join("")}</div>` : ""}
    <div class="btnrow" style="margin-top:16px"><button class="btn ghost" id="cuCancel">Later</button><button class="btn" id="cuDone">All caught up</button></div>`, o => {
    $("#cuCancel", o).onclick = closeSheet;
    $("#cuDone", o).onclick = () => {
      let total = 0;
      o.querySelectorAll("[data-cu]").forEach(inp => { const a = round2(num(inp.value)); if (a > 0) { total += a; S.tx.push({ id: uid(), ts: Date.now(), type: "expense", amount: a, catId: inp.dataset.cu, note: "Catch-up (estimate)", date: t }); } });
      o.querySelectorAll("[data-bill]").forEach(cb => { if (cb.checked) { const b = S.bills.find(x => x.id === cb.dataset.bill); if (b) { b.paid = b.paid || {}; b.paid[k] = true; } } });
      checkin(); save(); closeSheet(); render(); confetti(60);
      toast(total ? `Caught up. Welcome back 🌿` : "All caught up. Welcome back 🌿");
    };
  });
}

/* Backup */
function download(name, text) {
  const blob = new Blob([text], { type: "application/json" });
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
}
function exportData() { const d = JSON.parse(JSON.stringify(S)); delete d.ui; return d; }
function importData(obj) {
  if (!obj || typeof obj !== "object" || !obj.setup || !Array.isArray(obj.tx)) throw new Error("bad");
  S = migrate(obj); S.setup.done = true; fmtCache = {}; save(); render();
}
const b64e = s => btoa(unescape(encodeURIComponent(s)));
const b64d = s => decodeURIComponent(escape(atob(s)));
async function makeCode() {
  const json = JSON.stringify(exportData());
  try {
    const buf = await new Response(new Blob([json]).stream().pipeThrough(new CompressionStream("gzip"))).arrayBuffer();
    let bin = ""; new Uint8Array(buf).forEach(b => bin += String.fromCharCode(b));
    return "CALM2:" + btoa(bin);
  } catch (e) { return "CALM1:" + b64e(json); }
}
async function readCode(raw) {
  const v = raw.trim().replace(/\s/g, "");
  if (v.startsWith("CALM2:")) {
    const bin = atob(v.slice(6)), bytes = Uint8Array.from(bin, c => c.charCodeAt(0));
    return JSON.parse(await new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream("gzip"))).text());
  }
  return JSON.parse(b64d(v.replace(/^CALM1:/, "")));
}

/* Confetti */
function confetti(n = 140) {
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const c = $("#confetti"), ctx = c.getContext("2d");
  c.width = innerWidth * devicePixelRatio; c.height = innerHeight * devicePixelRatio; ctx.scale(devicePixelRatio, devicePixelRatio);
  const cs = getComputedStyle(document.documentElement);
  const cols = ["--accent", "--warn", "--pay", "--good", "--accent-strong"].map(v => cs.getPropertyValue(v).trim());
  const ps = Array.from({ length: n }, () => ({ x: innerWidth / 2 + (Math.random() - .5) * 120, y: innerHeight * .45, vx: (Math.random() - .5) * 12, vy: -Math.random() * 12 - 4, r: Math.random() * 6 + 4, c: cols[Math.floor(Math.random() * cols.length)], a: Math.random() * 6, va: (Math.random() - .5) * .3 }));
  let f = 0;
  (function tick() {
    ctx.clearRect(0, 0, innerWidth, innerHeight);
    ps.forEach(p => { p.vy += .35; p.vx *= .99; p.x += p.vx; p.y += p.vy; p.a += p.va; ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.a); ctx.fillStyle = p.c; ctx.globalAlpha = Math.max(0, 1 - f / 90); ctx.fillRect(-p.r / 2, -p.r / 4, p.r, p.r / 2); ctx.restore(); });
    if (++f < 90) requestAnimationFrame(tick); else { ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.clearRect(0, 0, c.width, c.height); }
  })();
}

  },
  theme: d => { S.settings.theme = d.v; save(); render(); },

  calSel: d => { S.ui.calSel = d.d; render(); },
  payBill: d => { const b = S.bills.find(x => x.id === d.id); if (!b) return; b.paid = b.paid || {}; b.paid[d.k] = !b.paid[d.k]; if (b.paid[d.k]) { checkin(); toast(`${b.name} marked paid ✓`); } save(); render(); },
  editBill: d => billSheet(d.id),
  editCat: d => catSheet(d.id),
  goalTab: d => { S.ui.goalTab = d.g; render(); },
  goGoals: d => { S.ui.tab = "goals"; S.ui.goalTab = d.g; render(); scrollTo(0, 0); },
  fund: d => fundActions(d.id),
  editFund: () => fundSheet(),
  debt: d => debtActions(d.id),
  editDebt: () => debtSheet(),
  strategy: d => { S.settings.debtStrategy = d.s; save(); render(); },
  editIncome: () => incomeSheet(),
  catchUp: () => catchUpSheet(),
  freshStart: () => confirmSheet("Fresh start this month?", "This clears this month's spending and income logs. Your bills, jars, debts and categories stay. Good for when the month got messy and you'd rather begin again from today.", "Start fresh", () => {
    const k = mkey(new Date()); S.tx = S.tx.filter(t => !inMonth(t.date, k)); checkin(); save(); render(); confetti(60); toast("Fresh start. You've got this 🌅");
  }),
  exportFile: () => { download(`calm-cash-backup-${todayStr()}.json`, JSON.stringify(exportData(), null, 1)); S.settings.lastBackup = todayStr(); save(); render(); toast("Backup downloaded"); },
  importFile: () => { const all = document.querySelectorAll("#fileIn"), f = all[all.length - 1]; if (!f) { A.backupHelp(); return; } f.onchange = () => { const file = f.files[0]; if (!file) return; const r = new FileReader(); r.onload = () => { try { importData(JSON.parse(r.result)); closeSheet(); toast("Backup restored"); } catch (e) { toast("That file doesn't look like a Calm Cash backup"); } }; r.readAsText(file); }; f.click(); },
  moveDevice: () => openSheet(`<h3>Move to another device</h3><p class="lead">Which device are you holding right now?</p>
    <button class="opt" id="mvSend"><span style="font-size:22px">📤</span><div><b>The one WITH my data</b><span>I'll get a code from here and send it to my other device.</span></div></button>
    <button class="opt" id="mvGet"><span style="font-size:22px">📥</span><div><b>The NEW or empty one</b><span>I already have a code and want my data here.</span></div></button>
    <div class="note">Tip: open the planner on both devices first. You'll get a code on one and paste it into the other.</div>
    <p class="tiny muted" style="text-align:center">Have a backup file instead? <a href="#" id="mvFile" style="color:var(--accent-strong);font-weight:700">Restore from file</a></p>`, o => {
    $("#mvSend", o).onclick = () => A.copyCode(); $("#mvGet", o).onclick = () => A.pasteCode(); $("#mvFile", o).onclick = e => { e.preventDefault(); A.backupHelp(); };
  }),
  copyCode: async () => {
    const code = await makeCode();
    const canShare = !!navigator.share;
    openSheet(`<h3>Send your data 📤</h3><p class="lead">Your transfer code is a long piece of text that holds your whole budget.</p>
      <ol class="how">
        <li><span>Tap <b>${canShare ? "Send it to myself" : "Copy code"}</b> below.</span></li>
        <li><span>${canShare ? "Pick WhatsApp, email or Notes and send it to <b>yourself</b>." : "Paste it somewhere you can open on your other device: an email or WhatsApp message to yourself, or a notes app."}</span></li>
        <li><span>On your other device, open that message and copy the whole code.</span></li>
        <li><span>Open Calm Cash there, go to <b>More › Move to another device › The NEW one</b>, and paste.</span></li>
      </ol>
      <div class="btnrow">${canShare ? `<button class="btn" id="shr">Send it to myself</button>` : ""}<button class="btn ${canShare ? "ghost" : ""}" id="cpy">Copy code</button></div>
      <details style="margin-top:14px"><summary class="tiny muted" style="cursor:pointer">Show the code</summary><textarea class="input" id="codeBox" rows="4" readonly style="font-size:11px;margin-top:8px">${esc(code)}</textarea></details>
      <div class="note">Keep it private. Anyone with this code can see your budget. The code is a snapshot: changes you make after copying it won't be included.</div>`, o => {
      const done = () => { S.settings.lastBackup = todayStr(); save(); };
      $("#cpy", o).onclick = async () => { try { await navigator.clipboard.writeText(code); } catch (e) { const b = $("#codeBox", o); b.closest("details").open = true; b.select(); document.execCommand("copy"); } done(); toast("Code copied. Now paste it into a message to yourself."); };
      const sh = $("#shr", o); if (sh) sh.onclick = async () => { try { await navigator.share({ title: "My Calm Cash transfer code", text: code }); done(); } catch (e) {} };
    });
  },
  pasteCode: () => openSheet(`<h3>Get your data 📥</h3><p class="lead">You'll need the transfer code from your other device.</p>
    <ol class="how">
      <li><span>On your <b>other</b> device, open Calm Cash and go to <b>More › Move to another device › The one WITH my data</b>. Send the code to yourself.</span></li>
      <li><span>On <b>this</b> device, open that message and copy the whole code (it starts with CALM).</span></li>
      <li><span>Tap <b>Paste</b> below, then <b>Load my data</b>.</span></li>
    </ol>
    <textarea class="input" id="codeIn" rows="4" placeholder="CALM2:..." style="font-size:12px"></textarea>
    <div class="btnrow"><button class="btn ghost" id="pst">Paste</button><button class="btn" id="useCode">Load my data</button></div>
    <div class="note">This replaces anything already on this device.</div>`, o => {
    $("#pst", o).onclick = async () => { try { $("#codeIn", o).value = (await navigator.clipboard.readText()).trim(); } catch (e) { $("#codeIn", o).focus(); toast("Press and hold in the box, then tap Paste"); } };
    $("#useCode", o).onclick = async () => { try { const v = $("#codeIn", o).value.trim(); if (!v) { toast("Paste your code first"); return; } importData(await readCode(v)); closeSheet(); toast("Your data is here 🎉"); } catch (e) { toast("That code didn't work. Make sure you copied all of it."); } };
  }),
  backupHelp: () => openSheet(`<h3>Backup file 💾</h3><p class="lead">A backup is a small file with all your data. If you clear your browser or lose your phone, you can bring everything back.</p>
    <ol class="how">
      <li><span>Tap <b>Download backup</b>. A file named <b>calm-cash-backup</b> plus the date goes to your Downloads (or Files on iPhone).</span></li>
      <li><span>Keep it somewhere safe, like Google Drive, iCloud or an email to yourself. Once a month is plenty.</span></li>
      <li><span>To bring it back, tap <b>Restore</b> and choose that file.</span></li>
    </ol>
    <div class="btnrow"><button class="btn" id="bkD">Download backup</button><button class="btn ghost" id="bkR">Restore</button></div>
    <input type="file" id="fileIn" accept=".json,application/json" hidden>`, o => {
    $("#bkD", o).onclick = () => { closeSheet(); A.exportFile(); };
    $("#bkR", o).onclick = () => A.importFile();
  }),
  resetAll: () => confirmSheet("Erase everything?", "All your data on this device will be deleted. Download a backup first if you might want it later.", "Erase all", () => { const theme = S.settings.theme; S = fresh(); S.settings.theme = theme; onb = { step: 0, draft: null }; save(); render(); }, true),
  // onboarding
  onbNext: () => { if (onb.step > 0) captureOnb(); onb.step++; render(); },
  onbBack: () => { captureOnb(); onb.step = Math.max(0, onb.step - 1); render(); },
  onbType: d => { captureOnb(); onb.draft.incomeType = d.v; render(); },
  onbFinish: () => {
    captureOnb(); const d = onb.draft;
    if (d.incomeType === "regular" && num(d.payAmount) <= 0) { toast("Add your take-home pay (a rough number is fine)"); $("#o_amt") && $("#o_amt").focus(); return; }
    Object.assign(S.setup, { done: true, name: d.name, currency: d.currency, incomeType: d.incomeType, payFreq: d.payFreq, payAmount: num(d.payAmount), nextPayday: d.nextPayday });
    fmtCache = {}; checkin(); save(); render(); confetti(80);
    setTimeout(() => openSheet(`<h3>You're set up 🌿</h3><p class="lead">One last tip: add your regular bills (rent, phone, subscriptions) so your safe-to-spend number is accurate.</p><div class="btnrow"><button class="btn ghost" id="lt">Later</button><button class="btn" id="ab">Add a bill</button></div>`, o => { $("#lt", o).onclick = closeSheet; $("#ab", o).onclick = () => billSheet(); }), 500);
  },
  loadSample: () => { const theme = S.settings.theme; S = sampleData(); S.settings.theme = theme; fmtCache = {}; save(); render(); toast("Sample data loaded. Erase it anytime in More."); }
};
document.addEventListener("click", e => {
  const el = e.target.closest("[data-act]");
  if (!el || el.disabled) return;
  if (el.tagName === "A") e.preventDefault();
  const fn = A[el.dataset.act]; if (fn) fn(el.dataset, el);
});
document.addEventListener("change", e => {
  const el = e.target.closest("[data-change]"); if (!el) return;
  const k = el.dataset.change, v = el.value;
  if (k === "name") S.setup.name = v.trim();
  if (k === "currency") { S.setup.currency = v; fmtCache = {}; }
  if (k === "debtExtra") S.settings.debtExtra = num(v);
  save(); render();
});
document.addEventListener("keydown", e => { if (e.key === "Escape") closeSheet(); });
matchMedia("(prefers-color-scheme: dark)").addEventListener?.("change", () => { if (S.settings.theme === "auto") render(); });

/* ---- Boot ---- */
(function boot() {
  const d = load();
  S = d ? migrate(d) : fresh();
  if (DEMO_MODE && !S.setup.done) { S = sampleData(); }
  render();
  // in-app reminder for bills due tomorrow (shown once per day)
  try {
    const t = todayStr(), tm = ymd(addDays(new Date(), 1));
    const due = billsInMonth(mkey(addDays(new Date(), 1))).filter(x => x.date === tm && !x.paid);
    if (S.setup.done && due.length && localStorage.getItem("calmcash_rem") !== t) { setTimeout(() => toast(`Heads up: ${due.map(x => x.b.name).join(", ")} due tomorrow`), 900); localStorage.setItem("calmcash_rem", t); }
  } catch (e) {}
  // offline install support when hosted
  if ("serviceWorker" in navigator && location.protocol.startsWith("http")) navigator.serviceWorker.register("sw.js").catch(() => {});
})();
</script>
